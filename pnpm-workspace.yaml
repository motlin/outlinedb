packages:
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  "@vitest/coverage-v8": 5.1.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Older postcss reads arbitrary .map files from an attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q).
  postcss: ">=8.5.23"
  # Dependabot triage 2026-11-15 (.llm/plans/2026-11-10-dependabot-triage.md): lift vulnerable transitive pins to patched releases.
  # @tobilu/qmd pins node-llama-cpp 3.20.0 (simple-git 3, critical argument injection) and @modelcontextprotocol/server 2.0.0 and zod 4.2.1.
  node-llama-cpp: "^3.22.3"
  simple-git: "^4.0.2"
  tar: "^7.5.21"
  nanoid@5: "^5.1.16"
  "@modelcontextprotocol/server": "^2.4.0"
  "@tobilu/qmd>zod": "^4.6.7"
  # onnx-proto (via @xenova/transformers > onnxruntime-web) asks for protobufjs 6; Node loads ort-web.node.js, which never requires it.
  protobufjs: "^7.6.6"
  # @xenova/transformers asks for sharp 0.32; it only loads sharp for image pipelines, and the CLI runs text feature extraction.
  sharp: "^0.35.5"
  undici: "^7.30.1"
  body-parser: "^2.4.0"
  qs: "^6.16.1"
  fast-uri: "^3.1.9"
  ip-address: "^10.7.4"
  fast-copy: "^4.1.0"
  re2js: "^2.8.7"
  source-map-js: "^1.2.2"
  minimatch@10: "^11.0.1"
  glob@13: "^14.0.2"
  katex: "^0.18.2"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  fallow: true
  node-llama-cpp: false
  protobufjs: false
  sharp: true
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  workerd: true
